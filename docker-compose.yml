services:
  db:
    image: postgres:16-alpine
    container_name: deliveryhub-db
    environment:
      POSTGRES_DB: deliveryhub
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4
    container_name: deliveryhub-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@deliveryhub.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - db

  app:
    build: .
    container_name: deliveryhub-app
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=deliveryhub
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - JWT_SECRET=change_this_secret_in_production_environments_123456
    depends_on:
      db:
        condition: service_healthy
